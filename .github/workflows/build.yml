name: Build

# Builds every Stonecutter version node and publishes the resulting mod jars.
#
# Zero per-version maintenance: the version list lives only in settings.gradle. The `chiseledBuild`
# task (stonecutter.gradle.kts) fans `build` out across EVERY version node, and each node compiles
# with its own Java toolchain (1.21.1 -> 21, 26.1.2 -> 25, ...) which the foojay resolver configured
# in settings.gradle auto-provisions. So adding a new MC version needs NO change to the build job.
#
# On a version tag (v*) the built + gametested jars are also published: a GitHub Release ("Publish
# release" step) and — when CurseForge is configured — one CurseForge Release file per MC version
# (the `curseforge` job at the bottom). Every other trigger just builds, tests, and uploads the
# jars as run artifacts.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to attach jars to a GitHub Release on tag pushes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Expose the mod version so the curseforge job can download this job's jar artifact by its
    # versioned name (skyseed-jars-<version>) without re-parsing gradle.properties.
    outputs:
      version: ${{ steps.modver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Expose mod_version (from gradle.properties) so the artifact name can carry it (skyseed-jars-<version>).
      # tr strips any trailing CR/whitespace so the name stays clean if the file has CRLF line endings.
      - name: Read mod version
        id: modver
        run: echo "version=$(grep -E '^mod_version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # Bootstrap JDK that runs Gradle itself. The per-version compile toolchains are auto-provisioned
      # (foojay), so this stays fixed even as the mod targets new Java versions.
      - name: Set up bootstrap JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The committed gradle.properties pins org.gradle.java.home to a local Windows path (handy for the
      # author's machine, fatal on a Linux runner). A gradle.properties under GRADLE_USER_HOME outranks
      # the project file, so point the daemon at the runner's JDK without touching the committed file.
      - name: Point Gradle daemon at the runner JDK
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.home=$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build all version nodes
        run: |
          chmod +x ./gradlew
          ./gradlew chiseledBuild --stacktrace --no-daemon

      # Run the gametest suite (the project's only tests — NeoForge GameTests on a headless server) on EVERY node.
      # chiseledRunGameTestServer (stonecutter.gradle.kts) fans runGameTestServer across nodes, so this stays
      # version-agnostic. Placed before jar collection so a test failure blocks publishing untested jars.
      # This default run has the optional guide backends (Patchouli/Modonomicon) on the classpath, so the suite
      # asserts the RICH-book integration path (guideBookMatchesInstalledBackends + modonomiconGuideBookIsComplete…).
      - name: Run gametests on every node
        run: ./gradlew chiseledRunGameTestServer --stacktrace --no-daemon

      # Re-run the SAME suite with the optional guide backends STRIPPED (-PnoOptionalDeps drops them from localRuntime;
      # compileOnly stays so the jar is unchanged). This proves Skyseed loads, generates, and hands out the vanilla
      # written-book Almanac with no optional mod installed — the "works stand-alone" contract. The suite branches on
      # ModList.isLoaded, so guideBookMatchesInstalledBackends asserts the degraded/no-op side here while the run above
      # asserts the rich side; both must pass before jars are published. See README "Building & running".
      - name: Run gametests stand-alone (no optional deps)
        run: ./gradlew chiseledRunGameTestServer -PnoOptionalDeps --stacktrace --no-daemon

      # Flatten the per-node jars (versions/<v>/build/libs/*.jar) into one folder. The glob is
      # version-agnostic, so new version nodes are picked up automatically.
      - name: Collect jars
        run: |
          mkdir -p dist
          find versions -path '*/build/libs/*.jar' -exec cp -v {} dist/ \;
          echo "---- collected jars ----"
          ls -l dist

      - name: Upload jars as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: skyseed-jars-${{ steps.modver.outputs.version }}
          path: dist/*.jar
          if-no-files-found: error

      # On a version tag (e.g. v0.164.0) also publish a GitHub Release with the jars attached.
      # Uses the runner's preinstalled GitHub CLI — no third-party action, so nothing here to
      # keep up to date as Node runtimes are deprecated.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: `gh release create` errors with "release already exists" on a re-run / re-pushed tag (or a prior
        # run that created the release then failed before uploading). If a release for this tag is already there, just
        # (re-)upload the jars with --clobber; otherwise create it fresh.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.jar --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Opt-in Create integration test (1.21.1 only — Create isn't published for 26.1.2). Loads the REAL Create mod via
  # `-PwithCreate` and runs the 1.21.1 gametest suite, so createZincOreActuallyPlaces asserts a real create:zinc_ore
  # BLOCK is placed. The normal build/gametest jobs run WITHOUT Create — there that test self-skips and
  # createZincIsInertWithoutCreate asserts nothing is placed instead. Kept a SEPARATE job on purpose: it never gates jar
  # publishing, so Create's heavy dependency graph (Flywheel / Ponder / Registrate, versions that drift) can't
  # destabilise the release path. Runs on PRs + manual dispatch only (not every tag/main push) since it's a slow check.
  create-integration:
    name: Create integration test (MC 1.21.1)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bootstrap JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21' # the 1.21.1 node compiles on Java 21

      - name: Point Gradle daemon at the runner JDK
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.home=$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # -PwithCreate adds the Create maven repos + Create/Ponder/Flywheel/Registrate to the 1.21.1 dev runtime, so the
      # gametest server boots with create:zinc_ore actually registered. createZincOreActuallyPlaces then plans a rocky
      # island and asserts the real block lands. If this 404s on a coordinate, bump the create_/ponder_/flywheel_/
      # registrate_ versions in gradle.properties — Create releases drift.
      - name: Run the 1.21.1 gametests with Create loaded
        run: |
          chmod +x ./gradlew
          ./gradlew :1.21.1:runGameTestServer -PwithCreate --stacktrace --no-daemon

  # On a version tag, publish each node's jar to CurseForge as a Release file — ONE upload per Minecraft
  # version (a node whose changelog has no entry for the tagged version didn't change this release and is
  # skipped, so single-node releases don't republish an unchanged jar). The two jars target different MC
  # versions and ship different changelogs. Publishing goes straight to the CurseForge Upload API (the
  # "Upload to CurseForge" step drives it with curl) rather than via mc-publish, because mc-publish can't set
  # the file environment (Client/Server) and re-escapes the markdown changelog — see that step's header for
  # the full rationale. It touches CurseForge only; the GitHub Release above is cut separately by the build job.
  #
  # Opt-in / kill switch: the job is gated on the CURSEFORGE_PROJECT_ID *variable*. Leave it unset and the
  # job is skipped, so tag builds still cut the GitHub Release with no CurseForge account wired up. Arm it:
  #   - repo variable  CURSEFORGE_PROJECT_ID  = the numeric project id from the mod's CurseForge page
  #   - repo secret    CURSEFORGE_TOKEN       = an UPLOAD API token from https://authors-old.curseforge.com/account/api-tokens
  #                                             (the author Upload API token — a UUID — NOT a console.curseforge.com
  #                                             "for Studios"/Core key, which is read-only and rejected as malformed)
  # (Secrets can't be read in a job-level `if`, so the variable is the on/off switch.)
  #
  # Unlike the build/gametest jobs, adding an MC version DOES cost a couple of lines here: a matrix entry pairing
  # the version with its changelog file and its Java version. That's unavoidable — CurseForge needs the game
  # version + Java stated per file, and the changelog names don't derive cleanly from the version (1.21.1 ->
  # CHANGELOG_1.21.1.md, but 26.1.2 -> CHANGELOG_26.1.md).
  curseforge:
    name: Publish to CurseForge (MC ${{ matrix.mc }})
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.CURSEFORGE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo + this run's artifact; the GitHub Release is handled by the build job
    strategy:
      fail-fast: false # one node failing to upload must NOT cancel the other node's upload
      matrix:
        include:
          - mc: "1.21.1"
            changelog: CHANGELOG_1.21.1.md
            java: "21"   # java_1.21.1 in gradle.properties — the CurseForge "Java" tag for this file
          - mc: "26.1.2"
            changelog: CHANGELOG_26.1.md
            java: "25"   # java_26.1.2 in gradle.properties
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Publish the exact bytes the build job built and gametested (artifact skyseed-jars-<version>) rather
      # than rebuilding. The artifact holds every node's jar; the files glob below picks out just this leg's.
      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          name: skyseed-jars-${{ needs.build.outputs.version }}
          path: dist

      # Discover the newest mod version ALREADY on CurseForge for this node, so the changelog below can
      # cover every release since it (not just this tag) — e.g. if 0.200.0 is live and we upload 0.225.0,
      # CurseForge users see 0.201.0..0.225.0. cfwidget.com exposes a project's published files as public
      # JSON (no API key needed). The uploaded jar is named skyseed-<mc>_<modver>.jar (the gradle build's own
      # filename, kept as-is by the upload), so it carries the MC version (to filter this node's files) and the
      # mod version (the value we want).
      # cfwidget answers 202 while it first caches a project; retry a few times, then fall back to empty
      # (the extract step degrades to this tag's own section — correct for a first-ever upload / cache miss).
      - name: Find the version already on CurseForge (MC ${{ matrix.mc }})
        id: lastcf
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MC: ${{ matrix.mc }}
        run: |
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sSL -w '%{http_code}' -o cfwidget.json "https://api.cfwidget.com/$PROJECT_ID" || echo 000)
            [ "$code" = "200" ] && break
            echo "cfwidget returned HTTP $code (attempt $attempt/3) — retrying in 5s"
            sleep 5
          done
          last=""
          if [ "$code" = "200" ]; then
            # ltrimstr/rtrimstr are literal (not regex), so the dots in <mc>/<modver> are matched as-is.
            # sort -V | tail -1 picks the highest version among this node's files.
            last=$(jq -r --arg mc "$MC" '
                     .files[]? | .name // empty
                     | select(startswith("skyseed-" + $mc + "_"))
                     | ltrimstr("skyseed-" + $mc + "_") | rtrimstr(".jar")
                   ' cfwidget.json 2>/dev/null | sort -V | tail -1) || last=""
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "Latest CurseForge version for MC $MC: '${last:-<none>}'"

      # CurseForge's changelog field wants the notes for THIS upload. Normally that's every release since
      # the file currently on CurseForge (steps.lastcf) up to this tag: the changelog is ordered
      # newest-first, so capture from the "## [<version>]" heading down to — but NOT including — the
      # "## [<lastcf>]" heading. Falls back to just this tag's own section when lastcf is empty/unknown,
      # equals this tag, or isn't a heading in this node's changelog (the grep guard stops a bad lookup
      # from dumping the whole file). The two nodes' changelogs diverge: a version that changed only one
      # node has no entry in the other's changelog, so if there's no "## [<version>]" section this node
      # didn't change this release — leave the output empty and skip its upload (skip=true) instead of
      # mislabelling some other version's notes.
      - name: Extract this release's changelog section(s)
        id: notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          LASTCF: ${{ steps.lastcf.outputs.last }}
        run: |
          if [ -n "$LASTCF" ] && [ "$LASTCF" != "$VERSION" ] && grep -q "^## \[$LASTCF\]" "${{ matrix.changelog }}"; then
            awk -v v="$VERSION" -v last="$LASTCF" '
              index($0, "## [" v "]") == 1 { f = 1; print; next }     # our version heading: start capturing
              /^## \[/ {                                              # a later version heading:
                if (f) {
                  if (index($0, "## [" last "]") == 1) exit           #   reached the CurseForge version: stop (exclusive)
                  print; next                                        #   an in-between release: keep it
                }
              }
              f                                                      # body line inside the captured range: print
            ' "${{ matrix.changelog }}" > cf-changelog.md
          else
            awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { f = 1; print; next }     # our version heading: start capturing
              /^## \[/ { if (f) exit }                               # next version heading: stop
              f                                                      # body line inside our section: print
            ' "${{ matrix.changelog }}" > cf-changelog.md
          fi
          if [ ! -s cf-changelog.md ]; then
            echo "No [$VERSION] section in ${{ matrix.changelog }} — MC ${{ matrix.mc }} unchanged this release; skipping its CurseForge upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "---- CurseForge changelog (MC ${{ matrix.mc }}) ----"
          cat cf-changelog.md

      # Publish this node's jar via the CurseForge Upload API directly (POST /projects/<id>/upload-file) rather
      # than through mc-publish. mc-publish (v3.3.0, the latest release) can't do two things this project needs:
      #   1. It never sets the file ENVIRONMENT — it categorises the Client/Server versions but omits them from
      #      the upload (see its getGameVersionIdVariants), so files land with no environment (had to be fixed by
      #      hand). Here we tag Client + Server explicitly.
      #   2. It can only send the changelog as changelogType=markdown — and CurseForge itself ESCAPES markdown-type
      #      changelogs (headings/bold come out as literal \#/\* on the file page, even from a byte-exact upload of
      #      clean markdown; verified on 0.230.0). Going direct lets us render the markdown to HTML ourselves and
      #      send changelogType=html, which CurseForge displays properly.
      # The one convenience mc-publish gave us — resolving CurseForge's numeric game-version ids — we do ourselves
      # from /game/versions (matching by exact name). Everything the API needs is set in the metadata below:
      # game versions (MC + NeoForge + Java + Client/Server), release type, and the optional-dependency relations.
      - name: Upload to CurseForge
        if: steps.notes.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MC: ${{ matrix.mc }}
          JAVA: ${{ matrix.java }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          API="https://minecraft.curseforge.com/api"

          # One /game/versions call lists every version across all types (Minecraft versions, mod loaders, Java
          # versions, and the Client/Server "environment"), each with a unique name — so a name match is exact.
          if ! curl -sSf -H "X-Api-Token: $TOKEN" "$API/game/versions" -o versions.json; then
            echo "::error::Could not fetch CurseForge game versions."; exit 1
          fi
          id_for() { jq -r --arg n "$1" 'map(select(.name == $n)) | (.[0].id // empty)' versions.json; }
          MC_ID=$(id_for "$MC"); NEO_ID=$(id_for "NeoForge")
          JAVA_ID=$(id_for "Java $JAVA"); CLIENT_ID=$(id_for "Client"); SERVER_ID=$(id_for "Server")

          # MC version + loader are mandatory: fail loudly if either can't be resolved (wrong/renamed tag).
          miss=""; [ -z "$MC_ID" ] && miss="$miss $MC"; [ -z "$NEO_ID" ] && miss="$miss NeoForge"
          if [ -n "$miss" ]; then echo "::error::Unresolved required CurseForge game-version id(s):$miss"; exit 1; fi
          # Java / Client / Server are best-effort: warn but still publish if CurseForge lacks the tag (e.g. a
          # brand-new "Java 25" not listed yet) rather than failing the release over a metadata tag.
          for pair in "Java $JAVA=$JAVA_ID" "Client=$CLIENT_ID" "Server=$SERVER_ID"; do
            [ -z "${pair#*=}" ] && echo "::warning::CurseForge has no '${pair%=*}' tag — uploading without it."
          done

          # gameVersions = every id that resolved (MC, NeoForge, Java, and the Client+Server environment).
          GV=$(jq -nc --arg a "$MC_ID" --arg b "$NEO_ID" --arg c "$JAVA_ID" --arg d "$CLIENT_ID" --arg e "$SERVER_ID" \
                '[$a,$b,$c,$d,$e] | map(select(. != "") | tonumber)')

          # Optional-dependency relations, by CurseForge slug (relations take slugs, not ids). All are
          # inert-without-the-mod integrations; keep in sync with neoforge.mods.toml's optional deps.
          REL=$(jq -nc '[
            "patchouli","modonomicon","oh-the-biomes-weve-gone","farmers-delight","quark",
            "immersive-engineering","irons-spells-n-spellbooks","applied-energistics-2","mystical-agriculture",
            "create","immersive-petroleum","my-nethers-delight","ends-delight","artifacts"
          ] | map({slug: ., type: "optionalDependency"})')

          # CurseForge's "markdown" changelogType ESCAPES every markdown metacharacter — a byte-exact upload of
          # clean markdown with changelogType=markdown still lands as literal \#, \*, \[ on the file page (proven
          # on 0.230.0, and the same result mc-publish gets). So render the markdown to HTML ourselves and upload
          # changelogType=html — CurseForge's canonical form (its WYSIWYG editor is HTML) — which displays
          # headings/bold/code/links properly. Convert in an isolated venv so the runner's PEP-668 system Python
          # can't block the pip install.
          python3 -m venv .mdenv
          .mdenv/bin/pip install --quiet markdown
          .mdenv/bin/python -m markdown cf-changelog.md > cf-changelog.html
          echo "---- rendered changelog HTML (MC $MC), first lines ----"; head -6 cf-changelog.html

          # --rawfile keeps the HTML byte-exact through jq's JSON string encoding.
          jq -n --rawfile changelog cf-changelog.html \
                --arg name "Skyseed $VERSION (MC $MC)" \
                --argjson gameVersions "$GV" --argjson projects "$REL" \
                '{changelog:$changelog, changelogType:"html", displayName:$name,
                  gameVersions:$gameVersions, releaseType:"release", relations:{projects:$projects}}' > metadata.json
          echo "---- upload metadata (MC $MC), changelog truncated ----"
          jq '.changelog |= (.[0:80] + "...")' metadata.json

          JAR=$(ls dist/skyseed-${MC}_*.jar 2>/dev/null | head -1 || true)
          if [ -z "${JAR:-}" ] || [ ! -f "$JAR" ]; then echo "::error::No jar matched dist/skyseed-${MC}_*.jar"; exit 1; fi
          echo "Uploading $JAR to CurseForge project $PROJECT_ID ..."

          # curl '-F field=<file' sends the field VALUE from a file (the metadata JSON); '-F file=@' attaches the
          # jar. Retry 5xx/network blips; a 4xx is a real rejection (bad token, bad metadata) — surface it, no retry.
          for attempt in 1 2 3; do
            http=$(curl -sS -w '%{http_code}' -o resp.json -X POST \
              -H "X-Api-Token: $TOKEN" \
              -F "metadata=<metadata.json" \
              -F "file=@$JAR" \
              "$API/projects/$PROJECT_ID/upload-file" || echo 000)
            echo "attempt $attempt/3 -> HTTP $http: $(cat resp.json 2>/dev/null || true)"
            case "$http" in
              200|201) echo "Uploaded to CurseForge (file id $(jq -r '.id // empty' resp.json))"; exit 0 ;;
              4*)      echo "::error::CurseForge rejected the upload (HTTP $http) - not retrying."; exit 1 ;;
              *)       echo "Transient HTTP $http - retrying in 10s"; sleep 10 ;;
            esac
          done
          echo "::error::CurseForge upload failed after 3 attempts."; exit 1
