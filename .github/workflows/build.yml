name: Build

# Builds every Stonecutter version node and publishes the resulting mod jars.
#
# Zero per-version maintenance: the version list lives only in settings.gradle. The `chiseledBuild`
# task (stonecutter.gradle.kts) fans `build` out across EVERY version node, and each node compiles
# with its own Java toolchain (1.21.1 -> 21, 26.1.2 -> 25, ...) which the foojay resolver configured
# in settings.gradle auto-provisions. So adding a new MC version needs NO change to the build job.
#
# On a version tag (v*) the built + gametested jars are also published: a GitHub Release ("Publish
# release" step) and — when CurseForge is configured — one CurseForge Release file per MC version
# (the `curseforge` job at the bottom). Every other trigger just builds, tests, and uploads the
# jars as run artifacts.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to attach jars to a GitHub Release on tag pushes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Expose the mod version so the curseforge job can download this job's jar artifact by its
    # versioned name (skyseed-jars-<version>) without re-parsing gradle.properties.
    outputs:
      version: ${{ steps.modver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Expose mod_version (from gradle.properties) so the artifact name can carry it (skyseed-jars-<version>).
      # tr strips any trailing CR/whitespace so the name stays clean if the file has CRLF line endings.
      - name: Read mod version
        id: modver
        run: echo "version=$(grep -E '^mod_version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # Bootstrap JDK that runs Gradle itself. The per-version compile toolchains are auto-provisioned
      # (foojay), so this stays fixed even as the mod targets new Java versions.
      - name: Set up bootstrap JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The committed gradle.properties pins org.gradle.java.home to a local Windows path (handy for the
      # author's machine, fatal on a Linux runner). A gradle.properties under GRADLE_USER_HOME outranks
      # the project file, so point the daemon at the runner's JDK without touching the committed file.
      - name: Point Gradle daemon at the runner JDK
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.home=$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build all version nodes
        run: |
          chmod +x ./gradlew
          ./gradlew chiseledBuild --stacktrace --no-daemon

      # Run the gametest suite (the project's only tests — NeoForge GameTests on a headless server) on EVERY node.
      # chiseledRunGameTestServer (stonecutter.gradle.kts) fans runGameTestServer across nodes, so this stays
      # version-agnostic. Placed before jar collection so a test failure blocks publishing untested jars.
      - name: Run gametests on every node
        run: ./gradlew chiseledRunGameTestServer --stacktrace --no-daemon

      # Flatten the per-node jars (versions/<v>/build/libs/*.jar) into one folder. The glob is
      # version-agnostic, so new version nodes are picked up automatically.
      - name: Collect jars
        run: |
          mkdir -p dist
          find versions -path '*/build/libs/*.jar' -exec cp -v {} dist/ \;
          echo "---- collected jars ----"
          ls -l dist

      - name: Upload jars as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: skyseed-jars-${{ steps.modver.outputs.version }}
          path: dist/*.jar
          if-no-files-found: error

      # On a version tag (e.g. v0.164.0) also publish a GitHub Release with the jars attached.
      # Uses the runner's preinstalled GitHub CLI — no third-party action, so nothing here to
      # keep up to date as Node runtimes are deprecated.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: `gh release create` errors with "release already exists" on a re-run / re-pushed tag (or a prior
        # run that created the release then failed before uploading). If a release for this tag is already there, just
        # (re-)upload the jars with --clobber; otherwise create it fresh.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.jar --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # On a version tag, publish each node's jar to CurseForge as a Release file — ONE upload per Minecraft
  # version (a node whose changelog has no entry for the tagged version didn't change this release and is
  # skipped, so single-node releases don't republish an unchanged jar). The two jars target different MC
  # versions and ship different changelogs. Uses
  # Kir-Antipov/mc-publish, which resolves CurseForge's numeric game-version IDs from its API for us and
  # (given only CurseForge credentials) publishes to CurseForge alone — it never touches the GitHub
  # Release cut above, since github-token is left unset.
  #
  # Opt-in / kill switch: the job is gated on the CURSEFORGE_PROJECT_ID *variable*. Leave it unset and the
  # job is skipped, so tag builds still cut the GitHub Release with no CurseForge account wired up. Arm it:
  #   - repo variable  CURSEFORGE_PROJECT_ID  = the numeric project id from the mod's CurseForge page
  #   - repo secret    CURSEFORGE_TOKEN       = an API token from https://authors.curseforge.com/account/api-tokens
  # (Secrets can't be read in a job-level `if`, so the variable is the on/off switch; mc-publish fails with
  # a clear message if the token is missing once the variable is set.)
  #
  # Unlike the build/gametest jobs, adding an MC version DOES cost one line here: a matrix entry pairing the
  # version with its changelog file. That's unavoidable — CurseForge needs the game version stated per file,
  # and the changelog names don't derive cleanly from the version (1.21.1 -> CHANGELOG_1.21.1.md, but
  # 26.1.2 -> CHANGELOG_26.1.md).
  curseforge:
    name: Publish to CurseForge (MC ${{ matrix.mc }})
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.CURSEFORGE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads the repo + this run's artifact; the GitHub Release is handled by the build job
    strategy:
      fail-fast: false # one node failing to upload must NOT cancel the other node's upload
      matrix:
        include:
          - mc: "1.21.1"
            changelog: CHANGELOG_1.21.1.md
          - mc: "26.1.2"
            changelog: CHANGELOG_26.1.md
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Publish the exact bytes the build job built and gametested (artifact skyseed-jars-<version>) rather
      # than rebuilding. The artifact holds every node's jar; the files glob below picks out just this leg's.
      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          name: skyseed-jars-${{ needs.build.outputs.version }}
          path: dist

      # CurseForge's changelog field wants THIS release's notes. Slice out the section headed
      # "## [<version>]" for the tagged version specifically — NOT just the top section. The two nodes'
      # changelogs diverge: a version that changed only one node has no entry in the other's changelog
      # (each file's preamble says so), so "top section" could be an OLDER version and would mislabel the
      # upload. If this node has no section for the version it didn't change this release, so skip its
      # upload (skip=true) instead of attaching some other version's notes.
      - name: Extract this release's changelog section
        id: notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { f = 1; print; next }   # our version heading: start capturing
            /^## \[/ { if (f) exit }                               # next version heading: stop
            f                                                      # body line inside our section: print
          ' "${{ matrix.changelog }}" > cf-changelog.md
          if [ ! -s cf-changelog.md ]; then
            echo "No [$VERSION] section in ${{ matrix.changelog }} — MC ${{ matrix.mc }} unchanged this release; skipping its CurseForge upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "---- CurseForge changelog (MC ${{ matrix.mc }}) ----"
          cat cf-changelog.md

      - name: Upload to CurseForge
        if: steps.notes.outputs.skip != 'true'
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          # Only this node's jar (skyseed-<mc>_<modver>.jar). The '_' after the MC version keeps the
          # 1.21.1 glob from also matching 26.1.2 (and vice-versa).
          files: dist/skyseed-${{ matrix.mc }}_*.jar
          name: Skyseed ${{ needs.build.outputs.version }} (MC ${{ matrix.mc }})
          version: ${{ needs.build.outputs.version }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ matrix.mc }}
          changelog-file: cf-changelog.md
          retry-attempts: 3 # ride out transient CurseForge API hiccups
